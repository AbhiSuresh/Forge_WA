<style>
  :root {
    --bg: #000000;
    --bg1: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --accent: #FF3D00;
    --accent2: #FF6D00;
    --green: #00E676;
    --red: #FF1744;
    --yellow: #FFD600;
    --text: #FFFFFF;
    --text2: #AAAAAA;
    --text3: #555555;
    --border: #222222;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Barlow', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    padding: calc(var(--safe-top) + 12px) 20px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }
  .topbar-back {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 8px;
    color: var(--text2);
    transition: color .15s;
  }
  .topbar-back:active { color: var(--text); }
  .topbar-title {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    flex: 1;
  }
  .topbar-sub { font-size: 13px; color: var(--text2); font-weight: 400; letter-spacing: 0; }
  .topbar-action {
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text); font-size: 13px; font-weight: 500;
    cursor: pointer; letter-spacing: .5px;
    font-family: var(--font-body);
    transition: background .15s;
  }
  .topbar-action:active { background: var(--bg3); }

  /* ── SCROLL AREA ── */
  .scroll-area {
    flex: 1; overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--safe-bottom) + 80px);
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding-bottom: var(--safe-bottom);
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 20;
  }
  .nav-item {
    flex: 1; padding: 10px 0 8px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer; color: var(--text3);
    transition: color .15s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-label { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; font-family: var(--font-display); }

  /* ── HOME / TODAY ── */
  .home-header {
    padding: 24px 20px 16px;
    background: var(--bg);
  }
  .home-date {
    font-family: var(--font-display);
    font-size: 13px; letter-spacing: 2px;
    color: var(--accent); text-transform: uppercase; font-weight: 600;
  }
  .home-day {
    font-family: var(--font-display);
    font-size: 38px; font-weight: 900; letter-spacing: 1px;
    line-height: 1.1;
  }
  .home-split {
    font-size: 13px; color: var(--text2); margin-top: 4px;
  }

  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 0 20px 16px;
  }
  .stat-card {
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .stat-card:active { border-color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; font-family: var(--font-display); }
  .stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 800; margin-top: 2px; }
  .stat-unit { font-size: 12px; color: var(--text2); margin-left: 3px; font-weight: 400; }

  .section-header {
    padding: 6px 20px 10px;
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 2px;
    color: var(--text2); text-transform: uppercase; font-weight: 700;
  }

  /* ── EXERCISE LIST ── */
  .exercise-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
  
  .exercise-item {
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden; cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .exercise-item:active { background: var(--bg2); }
  .exercise-item.completed { border-color: var(--green); }
  .exercise-item.missed { border-color: var(--red); opacity: .68; }

  .ex-top-row { display: flex; align-items: center; }

  .ex-img {
    width: 70px; height: 70px;
    flex-shrink: 0;
    background: var(--bg3);
    display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 22px;
    overflow: hidden;
  }
  .ex-img img { width: 100%; height: 100%; object-fit: cover; }

  .ex-info { flex: 1; padding: 13px 14px; min-width: 0; }
  .ex-name {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ex-muscle { font-size: 11px; color: var(--text2); margin-top: 3px; }

  /* Bottom status buttons */
  .ex-status-row {
    display: flex;
    border-top: 1px solid var(--border);
  }
  .ex-btn {
    flex: 1; height: 38px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    cursor: pointer; font-size: 12px; font-weight: 700;
    font-family: var(--font-display); letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--text3);
    transition: background .12s, color .12s;
  }
  .ex-btn + .ex-btn { border-left: 1px solid var(--border); }
  .ex-btn.done-active { background: rgba(0,230,118,.10); color: var(--green); }
  .ex-btn.miss-active { background: rgba(255,23,68,.10); color: var(--red); }
  .ex-btn:active { opacity: .65; }

  .status-indicator {
    width: 3px; position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 14px 0 0 14px;
    opacity: 0;
  }
  .exercise-item.completed .status-indicator { background: var(--green); opacity: 1; }
  .exercise-item.missed .status-indicator { background: var(--red); opacity: 1; }

  /* ── DAY CARD (workout screen) ── */
  .day-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
  .day-card {
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .day-card:active { border-color: var(--accent); }
  .day-card-header { display: flex; align-items: baseline; gap: 10px; }
  .day-number {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 800;
    color: var(--accent); letter-spacing: 1px;
  }
  .day-title {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 800;
    letter-spacing: .5px;
  }
  .day-exercises { font-size: 12px; color: var(--text2); margin-top: 6px; }
  .day-progress-bar { height: 3px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .day-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }

  /* ── EXERCISE DETAIL ── */
  .ex-detail-hero {
    width: 100%; height: 200px;
    background: var(--bg2);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .ex-detail-hero img { width: 100%; height: 100%; object-fit: contain; background: var(--bg2); }
  .ex-detail-hero .hero-placeholder {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--text3); width: 100%;
    cursor: pointer; padding: 0 20px;
  }
  .upload-btn-hero {
    padding: 7px 14px;
    background: var(--bg3); border: 1px dashed var(--border);
    color: var(--text2); border-radius: 8px;
    font-size: 12px; cursor: pointer; font-family: var(--font-body);
    white-space: nowrap;
  }
  .upload-btn-hero:active { background: var(--bg2); }
  .hero-change-btn {
    position: absolute; bottom: 7px; right: 10px;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    color: #fff; font-size: 11px; font-family: var(--font-body);
    border: none; cursor: pointer;
  }

  .ex-detail-body { padding: 20px; }
  .ex-detail-name {
    font-family: var(--font-display);
    font-size: 32px; font-weight: 900; letter-spacing: 1px;
    line-height: 1.1;
  }
  .ex-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; letter-spacing: .5px;
    font-family: var(--font-display);
    text-transform: uppercase;
  }
  .tag-primary { background: rgba(255,61,0,.15); border: 1px solid rgba(255,61,0,.3); color: var(--accent); }
  .tag-secondary { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); }

  .ex-section-title {
    font-family: var(--font-display);
    font-size: 14px; font-weight: 800; letter-spacing: 2px;
    color: var(--accent); text-transform: uppercase;
    margin: 20px 0 10px;
  }
  .muscle-list { display: flex; flex-direction: column; gap: 6px; }
  .muscle-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .muscle-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .muscle-dot.primary { background: var(--accent); }
  .muscle-dot.secondary { background: var(--text3); }
  .muscle-name { flex: 1; }
  .muscle-type { font-size: 11px; color: var(--text3); font-family: var(--font-display); letter-spacing: .5px; }

  .steps-list { display: flex; flex-direction: column; gap: 12px; }
  .step-item { display: flex; gap: 14px; }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 13px; font-weight: 700;
    flex-shrink: 0; margin-top: 1px; color: var(--accent);
  }
  .step-text { font-size: 14px; line-height: 1.55; color: var(--text2); }

  .tips-list { display: flex; flex-direction: column; gap: 8px; }
  .tip-item { display: flex; gap: 10px; font-size: 14px; color: var(--text2); line-height: 1.5; }
  .tip-icon { color: var(--yellow); flex-shrink: 0; }

  /* AI LOADING */
  .ai-loading { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 14px; padding: 16px 0; }
  .ai-spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ATTENDANCE ── */
  .attendance-container { padding: 0 20px; }
  .month-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 14px;
  }
  .month-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .month-nav { display: flex; gap: 8px; }
  .month-btn {
    width: 36px; height: 36px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2);
  }
  .month-btn:active { background: var(--bg3); }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-header { text-align: center; font-size: 11px; color: var(--text3); font-weight: 700; font-family: var(--font-display); letter-spacing: .5px; padding: 6px 0; }
  .cal-day {
    aspect-ratio: 1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--bg1); border: 1px solid transparent;
    transition: all .15s; font-family: var(--font-display);
    position: relative;
  }
  .cal-day:empty { background: transparent; cursor: default; }
  .cal-day.today { border-color: var(--accent); color: var(--accent); }
  .cal-day.present { background: var(--bg1); color: var(--green); font-weight: 800; }
  .cal-day.absent { background: var(--bg1); color: var(--red); font-weight: 800; opacity: 1; }
  .cal-day.future { opacity: .3; cursor: default; }
  .cal-day:active:not(.future):not(:empty) { transform: scale(.92); }

  .attendance-legend { display: flex; gap: 16px; margin: 14px 0; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .attendance-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .att-stat { background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .att-stat-val { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
  .att-stat-label { font-size: 10px; color: var(--text2); margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; font-family: var(--font-display); }

  /* ── WEIGHT LOG ── */
  .weight-container { padding: 0 20px; }
  .weight-input-card {
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin: 16px 0;
  }
  .weight-input-row { display: flex; align-items: center; gap: 12px; }
  .weight-input {
    flex: 1; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; font-size: 28px; font-weight: 700;
    color: var(--text); text-align: center;
    font-family: var(--font-display); letter-spacing: 1px;
    outline: none;
    -moz-appearance: textfield;
  }
  .weight-input::-webkit-inner-spin-button, .weight-input::-webkit-outer-spin-button { display: none; }
  .weight-input:focus { border-color: var(--accent); }
  .weight-unit { font-family: var(--font-display); font-size: 18px; color: var(--text2); }
  .weight-save-btn {
    width: 100%; margin-top: 14px;
    background: var(--accent); color: var(--text);
    border: none; border-radius: 10px; padding: 13px;
    font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; text-transform: uppercase;
    transition: opacity .15s;
  }
  .weight-save-btn:active { opacity: .85; }

  .weight-chart { margin-top: 8px; }
  .chart-canvas-wrap { width: 100%; height: 180px; position: relative; }
  canvas#weightChart { width: 100% !important; height: 100% !important; }

  .weight-history { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .weight-entry {
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .weight-entry-date { font-size: 13px; color: var(--text2); }
  .weight-entry-val { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
  .weight-entry-diff { font-size: 12px; margin-left: 4px; }
  .weight-entry-diff.up { color: var(--red); }
  .weight-entry-diff.down { color: var(--green); }
  .weight-entry-diff.same { color: var(--text3); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.85); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 20px;
    width: 100%; max-width: 480px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 70vh; overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-family: var(--font-display); font-size: 20px; font-weight: 800; margin-bottom: 14px; }
  .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .modal-btn {
    padding: 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text);
    font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: .5px;
    cursor: pointer; text-transform: uppercase;
    transition: background .15s;
  }
  .modal-btn:active { background: var(--bg3); }
  .modal-btn.primary { background: var(--accent); border-color: var(--accent); }
  .modal-btn.primary:active { opacity: .85; }

  /* TOAST */
  .toast {
    position: fixed; top: calc(var(--safe-top) + 60px); left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500; z-index: 200;
    opacity: 0; transition: all .25s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* PAGE TRANSITIONS */
  .page { display: none; flex-direction: column; height: 100%; }
  .page.active { display: flex; }

  /* ── DATA FILL MODALS ── */
  .data-modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.92); backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .data-modal-overlay.open { opacity: 1; pointer-events: all; }
  .data-modal {
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 82vh; display: flex; flex-direction: column;
  }
  .data-modal-overlay.open .data-modal { transform: translateY(0); }
  .data-modal-header {
    padding: 14px 20px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .data-modal-scroll {
    flex: 1; overflow-y: auto; padding: 16px 20px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .data-modal-footer {
    padding: 12px 20px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex-shrink: 0;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  /* ── WEIGHT EDIT ── */
  .weight-entry { cursor: pointer; }
  .weight-entry:active { opacity: .75; }
  .we-actions { display: flex; gap: 6px; }
  .we-btn {
    padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2); font-size: 12px;
    font-family: var(--font-display); font-weight: 700; cursor: pointer;
    letter-spacing: .3px;
  }
  .we-btn.del { color: var(--red); border-color: rgba(255,23,68,.25); }
  .we-btn.del:active { background: rgba(255,23,68,.12); }
  .we-btn:active { background: var(--bg3); }

  /* inline edit row in weight history */
  .we-edit-row {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
  }
  .we-edit-input {
    flex: 1; background: var(--bg2); border: 1px solid var(--accent);
    border-radius: 8px; padding: 9px 12px; font-size: 22px; font-weight: 700;
    color: var(--text); font-family: var(--font-display); text-align: center; outline: none;
    -moz-appearance: textfield;
  }
  .we-edit-input::-webkit-inner-spin-button { display: none; }
  .we-save-btn {
    padding: 9px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--text);
    font-family: var(--font-display); font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .we-cancel-btn {
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2);
    font-family: var(--font-display); font-weight: 700; font-size: 13px; cursor: pointer;
  }

  /* ── PAST DATE WEIGHT ENTRY ── */
  .date-input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .date-input-field {
    flex: 1; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px;
    color: var(--text); font-size: 15px; font-family: var(--font-body);
    outline: none;
  }
  .date-input-field:focus { border-color: var(--accent); }

  /* ── WORKOUT LOG FILLER ── */
  .wl-date-section {
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 14px; overflow: hidden;
  }
  .wl-date-header {
    padding: 13px 16px; display: flex; align-items: center;
    justify-content: space-between; cursor: pointer;
    background: var(--bg2);
  }
  .wl-date-header:active { opacity: .8; }
  .wl-date-label { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
  .wl-date-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .wl-chevron { color: var(--text3); font-size: 18px; transition: transform .2s; }
  .wl-chevron.open { transform: rotate(90deg); }
  .wl-exercises { display: none; padding: 10px 14px 14px; border-top: 1px solid var(--border); }
  .wl-exercises.open { display: block; }
  .wl-ex-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .wl-ex-row:last-child { border-bottom: none; }
  .wl-ex-name { flex: 1; font-size: 14px; font-weight: 500; }
  .wl-ex-btns { display: flex; gap: 6px; }
  .wl-ex-btn {
    padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2);
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    cursor: pointer; letter-spacing: .3px; transition: all .1s;
  }
  .wl-ex-btn.done-on {
    background: rgba(0,230,118,.12); border-color: var(--green); color: var(--green);
  }
  .wl-ex-btn.miss-on {
    background: rgba(255,23,68,.1); border-color: var(--red); color: var(--red);
  }
  .wl-ex-btn:active { opacity: .75; }

  /* quick fill bar */
  .wl-quick-fill {
    display: flex; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .wl-qf-label { font-size: 11px; color: var(--text3); flex: 1; font-family: var(--font-display); letter-spacing: .5px; text-transform: uppercase; }
  .wl-qf-btn {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg3); color: var(--text2);
    font-family: var(--font-display); font-size: 11px; font-weight: 700;
    cursor: pointer; letter-spacing: .3px;
  }
  .wl-qf-btn:active { opacity: .75; }

  /* add-weight helper button */
  .add-hist-btn {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px dashed var(--border); background: transparent;
    color: var(--text2); font-family: var(--font-display); font-size: 14px;
    font-weight: 700; cursor: pointer; letter-spacing: .5px; margin-top: 10px;
  }
  .add-hist-btn:active { background: var(--bg2); }

  /* ── STREAK BADGE ── */
  .streak-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,214,0,.08); border: 1px solid rgba(255,214,0,.2);
    border-radius: 20px; padding: 4px 10px;
    font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--yellow);
    margin-top: 8px;
  }

  .rest-day-card {
    margin: 16px 20px;
    background: var(--bg1); border: 1px solid var(--border); border-radius: 14px;
    padding: 30px 20px; text-align: center;
  }
  .rest-icon { font-size: 48px; margin-bottom: 12px; }
  .rest-title { font-family: var(--font-display); font-size: 24px; font-weight: 900; letter-spacing: 1px; }
  .rest-sub { font-size: 14px; color: var(--text2); margin-top: 6px; }

  .edit-day-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text2);
    cursor: pointer; flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .edit-day-btn:active { background: var(--bg3); color: var(--text); }

  /* ── EDIT DAY MODAL ── */
  .edit-modal-overlay {
    position: fixed; inset: 0; z-index: 150;
    background: rgba(0,0,0,.9); backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .edit-modal-overlay.open { opacity: 1; pointer-events: all; }
  .edit-modal {
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 88vh; display: flex; flex-direction: column;
  }
  .edit-modal-overlay.open .edit-modal { transform: translateY(0); }
  .edit-modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .edit-modal-scroll { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .edit-modal-footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex-shrink: 0;
    padding-bottom: calc(var(--safe-bottom) + 12px);
  }

  .edit-ex-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px;
  }
  .edit-ex-name { flex: 1; font-size: 14px; font-weight: 600; font-family: var(--font-display); }
  .edit-ex-muscle { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .edit-ex-remove {
    width: 28px; height: 28px; border-radius: 6px;
    background: rgba(255,23,68,.1); border: 1px solid rgba(255,23,68,.2);
    color: var(--red); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; flex-shrink: 0;
    transition: background .15s;
  }
  .edit-ex-remove:active { background: rgba(255,23,68,.25); }

  .add-ex-picker { margin-top: 12px; }
  .add-ex-search {
    width: 100%; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; color: var(--text); font-size: 14px;
    font-family: var(--font-body); outline: none;
    margin-bottom: 10px;
  }
  .add-ex-search:focus { border-color: var(--accent); }
  .add-ex-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 6px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .add-ex-option:active { background: var(--bg2); border-color: var(--accent); }
  .add-ex-option.already-added { opacity: .38; pointer-events: none; }

  .title-edit-input {
    width: 100%; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; color: var(--text); font-size: 16px;
    font-family: var(--font-display); font-weight: 700; letter-spacing: .5px;
    outline: none; margin-bottom: 12px;
    text-transform: uppercase;
  }
  .title-edit-input:focus { border-color: var(--accent); }

  .edit-section-label {
    font-family: var(--font-display); font-size: 11px;
    font-weight: 800; letter-spacing: 2px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 8px; margin-top: 4px;
  }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>
<div id="app">

  <!-- ══════════════ PAGE: HOME (TODAY) ══════════════ -->
  <div id="page-home" class="page active">
    <div class="topbar">
      <div style="flex:1">
        <div class="topbar-title">FORGE</div>
      </div>
      <button class="topbar-action" onclick="showWeightModal()">+ Weight</button>
    </div>
    <div class="scroll-area" id="home-scroll">
      <!-- Dynamic content injected by JS -->
    </div>
  </div>

  <!-- ══════════════ PAGE: WORKOUTS ══════════════ -->
  <div id="page-workouts" class="page">
    <div class="topbar">
      <div class="topbar-title">Workouts</div>
    </div>
    <div class="scroll-area" style="padding: 16px 0 0">
      <div class="day-list" id="workout-day-list"></div>
    </div>
  </div>

  <!-- ══════════════ PAGE: DAY DETAIL ══════════════ -->
  <div id="page-day" class="page">
    <div class="topbar">
      <div class="topbar-back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

// ══════════════════════════════════════════════
// STATE & STORAGE
// ══════════════════════════════════════════════
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let state = {
  workoutLog: load('forge_workoutLog', {}),    // { "2024-06-07": { "incline-db-press": "completed"|"missed" } }
  attendance: load('forge_attendance', {}),     // { "2024-06-07": true/false }
  weights: load('forge_weights', []),           // [{ date, value }]
  exerciseImages: load('forge_exImages', {}),   // { exId: dataURL }
  currentPage: 'home',
  pageStack: [],
  currentDayId: null,
  currentExId: null,
};

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getCurrentDayOfWeek() {
  // 1=Monday ... 7=Sunday (mapped from JS 0=Sun..6=Sat)
  const js = new Date().getDay();
  return js === 0 ? 7 : js;
}

function getDayPlan(dayNum) {
  // dayNum 1–7 maps directly to index 0–6
  return WORKOUT_PLAN[dayNum - 1] || WORKOUT_PLAN[6];
}

function getExerciseStatus(exId, dateKey) {
  dateKey = dateKey || todayKey();
  return (state.workoutLog[dateKey] || {})[exId] || null;
}

function setExerciseStatus(exId, status) {
  const k = todayKey();
  if (!state.workoutLog[k]) state.workoutLog[k] = {};
  if (state.workoutLog[k][exId] === status) {
    delete state.workoutLog[k][exId];
  } else {
    state.workoutLog[k][exId] = status;
  }
  save('forge_workoutLog', state.workoutLog);
}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
function navigate(page, push=false) {
  if (push) state.pageStack.push(state.currentPage);

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.getElementById(`page-${page}`).classList.add('active');

  const navMap = { home:'nav-home', workouts:'nav-workouts', attendance:'nav-attendance', weight:'nav-weight' };
  const navEl = document.getElementById(navMap[page]);
  if (navEl) navEl.classList.add('active');

  state.currentPage = page;

  if (page === 'home') renderHome();
  if (page === 'workouts') renderWorkouts();
  if (page === 'attendance') renderAttendance();
  if (page === 'weight') renderWeight();
}

function goBack() {
  const prev = state.pageStack.pop() || 'home';
  navigate(prev);
}

function showDayDetail(dayNum) {
  state.currentDayId = dayNum;
  state.pageStack.push(state.currentPage);
  const plan = getDayPlan(dayNum);
  document.getElementById('day-page-title').textContent = plan.title;
  document.getElementById('day-page-sub').textContent = plan.label;
  renderDayExercises(plan);
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-day').classList.add('active');
  state.currentPage = 'day';
}

function showExerciseDetail(exId, dayNum) {
  state.currentExId = exId;
  state.pageStack.push(state.currentPage);
  const plan = getDayPlan(dayNum);
  const ex = plan.exercises.find(e => e.id === exId);
  document.getElementById('ex-page-title').textContent = ex.name;
  renderExerciseDetail(ex, dayNum);
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-exercise').classList.add('active');
  state.currentPage = 'exercise';
}

// ══════════════════════════════════════════════
// RENDER: HOME
// ══════════════════════════════════════════════
function renderHome() {
  const scroll = document.getElementById('home-scroll');
  const today = new Date();
  const dayNum = getCurrentDayOfWeek();
  const plan = getDayPlan(dayNum);
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${dayNames[today.getDay()]}, ${today.getDate()} ${monthNames[today.getMonth()]}`;

  const todayK = todayKey();
  const todayLog = state.workoutLog[todayK] || {};
  const weights = state.weights;
  const lastWeight = weights.length ? weights[weights.length-1].value : '—';

  // Streak
  let streak = 0;
  let d = new Date();
  for (let i=0; i<365; i++) {
    const k = dateKey(d);
    if (state.attendance[k]) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }

  let completedCount = Object.values(todayLog).filter(v=>v==='completed').length;
  let totalEx = plan.exercises.length;

  let html = `<div class="home-header">
    <div class="home-date">${dateStr}</div>
    <div class="home-day">Day ${dayNum} — ${plan.title}</div>
    ${streak>0 ? `<div class="streak-badge">🔥 ${streak} day streak</div>` : ''}
  </div>
  <div class="stats-row">
    <div class="stat-card" onclick="navigate('weight')">
      <div class="stat-label">Weight</div>
      <div class="stat-value">${lastWeight}<span class="stat-unit">kg</span></div>
    </div>
    <div class="stat-card" onclick="navigate('attendance')">
      <div class="stat-label">Today</div>
      <div class="stat-value">${completedCount}<span class="stat-unit">/ ${totalEx}</span></div>
    </div>
  </div>`;

  if (plan.exercises.length === 0) {
    html += `<div class="rest-day-card">
      <div class="rest-icon">😴</div>
      <div class="rest-title">Rest & Recovery</div>
      <div class="rest-sub">No training today. Let your muscles recover and grow.</div>
    </div>`;
  } else {
    html += `<div class="section-header">Today's Exercises</div>
    <div class="exercise-list">`;
    plan.exercises.forEach(ex => {
      const status = getExerciseStatus(ex.id);
      const img = state.exerciseImages[ex.id];
      html += buildExerciseItem(ex, plan.day, status, img, true);
    });
    html += `</div>`;
  }

  scroll.innerHTML = html;
}

function buildExerciseItem(ex, dayId, status, img, showActions) {
  const imgContent = img
    ? `<img src="${img}" alt="${ex.name}">`
    : `<span style="font-size:22px;color:var(--text3)">💪</span>`;

  const doneActive = status === 'completed' ? 'done-active' : '';
  const missActive = status === 'missed' ? 'miss-active' : '';

  const statusRow = showActions ? `
    <div class="ex-status-row" onclick="event.stopPropagation()">
      <div class="ex-btn ${doneActive}" onclick="toggleExStatus('${ex.id}','completed')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Done
      </div>
      <div class="ex-btn ${missActive}" onclick="toggleExStatus('${ex.id}','missed')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Skipped
      </div>
    </div>` : '';

  return `<div class="exercise-item ${status||''}" onclick="showExerciseDetail('${ex.id}',${dayId})">
    <div class="status-indicator"></div>
    <div class="ex-top-row">
      <div class="ex-img">${imgContent}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-muscle">${ex.primary}</div>
      </div>
    </div>
    ${statusRow}
  </div>`;
}

function toggleExStatus(exId, status) {
  setExerciseStatus(exId, status);
  renderHome();
  if (state.currentPage === 'day') {
    const plan = getDayPlan(state.currentDayId);
    renderDayExercises(plan);
  }
}

// ══════════════════════════════════════════════
// RENDER: WORKOUTS (Day 1–7 individually)
// ══════════════════════════════════════════════
function renderWorkouts() {
  const list = document.getElementById('workout-day-list');
  const todayDayNum = getCurrentDayOfWeek();
  const todayK = todayKey();

  let html = '';
  WORKOUT_PLAN.forEach(plan => {
    const isToday = plan.day === todayDayNum;
    const exCount = plan.exercises.length;
    const log = state.workoutLog[todayK] || {};
    const done = isToday ? plan.exercises.filter(e => log[e.id] === 'completed').length : 0;
    const pct = (isToday && exCount) ? (done / exCount * 100) : 0;
    const dayColors = ['#FF3D00','#FF6D00','#FFD600','#00E676','#00B0FF','#D500F9','#555555'];
    const accentCol = plan.day === 7 ? 'var(--text3)' : dayColors[plan.day - 1];

    html += `<div class="day-card" onclick="showDayDetail(${plan.day})" style="${isToday ? 'border-color:var(--accent);background:rgba(255,61,0,.04)' : ''}">
      <div class="day-card-header" style="align-items:center">
        <div style="width:30px;height:30px;border-radius:8px;background:${accentCol}22;border:1px solid ${accentCol}44;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;font-weight:800;color:${accentCol};flex-shrink:0">${plan.day}</div>
        <div style="flex:1;margin-left:10px">
          <div class="day-title" style="font-size:17px">${plan.title}</div>
          <div class="day-exercises" style="margin-top:2px">${exCount ? exCount + ' exercises' : 'Rest day'}</div>
        </div>
        ${isToday ? `<span style="font-size:10px;color:var(--accent);font-family:var(--font-display);letter-spacing:1px;padding:3px 8px;border:1px solid rgba(255,61,0,.3);border-radius:20px;margin-right:6px">TODAY</span>` : ''}
        <div class="edit-day-btn" onclick="event.stopPropagation();openEditDay(${plan.day})" title="Edit workout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
      </div>
      ${(isToday && exCount) ? `<div class="day-progress-bar" style="margin-top:10px"><div class="day-progress-fill" style="width:${pct}%"></div></div>` : ''}
    </div>`;
  });
  list.innerHTML = html;
}

// ══════════════════════════════════════════════
// RENDER: DAY EXERCISES
// ══════════════════════════════════════════════
function renderDayExercises(plan) {
  const list = document.getElementById('day-exercise-list');
  if (!plan.exercises.length) {
    list.innerHTML = `<div class="rest-day-card"><div class="rest-icon">😴</div><div class="rest-title">Rest & Recovery</div><div class="rest-sub">Rest completely today.</div></div>`;
    return;
  }
  const todayDayNum = getCurrentDayOfWeek();
  const isToday = plan.day === todayDayNum;
  let html = '';
  plan.exercises.forEach(ex => {
    const status = isToday ? getExerciseStatus(ex.id) : null;
    const img = state.exerciseImages[ex.id];
    html += buildExerciseItem(ex, plan.day, status, img, isToday);
  });
  list.innerHTML = html;
}

// ══════════════════════════════════════════════

function renderExerciseDetail(ex, dayNum) {

async function fetchAIExerciseData(ex) {
  const loader = document.getElementById(`ai-loader-${ex.id}`);
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `For the gym exercise "${ex.name}", return ONLY a JSON object (no markdown, no preamble) with this exact shape:
{
  "muscles": [{"name":"...", "type":"primary"|"secondary"}],
  "steps": ["step 1 text", "step 2 text", ...],
  "tips": ["tip 1", "tip 2", ...]
}
Include 3-5 muscles, 4-6 steps, 3-4 tips.`
        }]
      })
    });
    const data = await response.json();
    const text = data.content?.[0]?.text || '';
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    EXERCISE_DATA[ex.id] = parsed;
    // Re-render exercise detail
    const plan = WORKOUT_PLAN.find(p => p.exercises.some(e => e.id === ex.id));
    if (plan) renderExerciseDetail(ex, plan.day);
  } catch(e) {
    if (loader) loader.innerHTML = '<span style="color:var(--text3);font-size:13px">Could not load exercise info. Check connection.</span>';
  }
}

function triggerImageUpload(exId, dayId) {
  document.getElementById(`img-upload-${exId}`).click();
}

function handleImageUpload(event, exId, dayNum) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const dataURL = e.target.result;
    // 1. Keep in runtime state
    state.exerciseImages[exId] = dataURL;
    // 2. Persist to localStorage (fast, synchronous)
    save('forge_exImages', state.exerciseImages);
    // 3. Persist to IndexedDB via Service Worker (survives storage pressure)
    await idbSaveImage(exId, dataURL);
    // 4. Re-render
    const plan = getDayPlan(parseInt(dayNum));
    const ex = plan.exercises.find(e => e.id === exId);
    renderExerciseDetail(ex, parseInt(dayNum));
    showToast('Image saved offline ✓');
  };
  reader.readAsDataURL(file);
}

let calViewDate = new Date();

function renderAttendance() {
  const body = document.getElementById('attendance-body');
  const today = new Date();
  const year = calViewDate.getFullYear();
  const month = calViewDate.getMonth();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayAbbr = ['S','M','T','W','T','F','S'];
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Stats
  const allKeys = Object.keys(state.attendance);
  const totalPresent = allKeys.filter(k => state.attendance[k]).length;
  const totalAbsent = allKeys.filter(k => state.attendance[k] === false).length;
  let streak = 0;
  let sd = new Date();
  for (let i=0; i<365; i++) {
    const k = dateKey(sd);
    if (state.attendance[k]) { streak++; sd.setDate(sd.getDate()-1); } else break;
  }

  let calHtml = dayAbbr.map(d => `<div class="cal-header">${d}</div>`).join('');
  for (let i=0; i<firstDay; i++) calHtml += `<div class="cal-day"></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const dt = new Date(year, month, d);
    const k = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isFuture = dt > today;
    const isToday = k === todayKey();
    const att = state.attendance[k];
    let cls = 'cal-day';
    if (isFuture) cls += ' future';
    else if (att === true) cls += ' present';
    else if (att === false) cls += ' absent';
    else if (isToday) cls += ' today';
    const clickFn = isFuture ? '' : `onclick="toggleAttendance('${k}')"`;
    calHtml += `<div class="${cls}" ${clickFn}>${d}</div>`;
  }

  body.innerHTML = `
    <div class="month-header">
      <div class="month-title">${monthNames[month]} ${year}</div>
      <div class="month-nav">
        <div class="month-btn" onclick="shiftMonth(-1)">‹</div>
        <div class="month-btn" onclick="shiftMonth(1)">›</div>
      </div>
    </div>
    <div class="calendar-grid">${calHtml}</div>
    <div class="attendance-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Present</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Absent</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent);border-radius:3px"></div>Today</div>
    </div>
    <div class="attendance-stats">
      <div class="att-stat"><div class="att-stat-val" style="color:var(--green)">${totalPresent}</div><div class="att-stat-label">Present</div></div>
      <div class="att-stat"><div class="att-stat-val" style="color:var(--red)">${totalAbsent}</div><div class="att-stat-label">Absent</div></div>
      <div class="att-stat"><div class="att-stat-val" style="color:var(--yellow)">${streak}</div><div class="att-stat-label">Streak</div></div>
    </div>
    <div style="padding:16px 0 8px">
      <div class="section-header" style="padding:0 0 10px">Mark Today</div>
      <div style="display:flex;gap:10px">
        <button onclick="toggleAttendance('${todayKey()}', true)" style="flex:1;padding:13px;border-radius:10px;border:1px solid ${state.attendance[todayKey()]===true?'var(--green)':'var(--border)'};background:${state.attendance[todayKey()]===true?'rgba(0,230,118,.12)':'var(--bg1)'};color:${state.attendance[todayKey()]===true?'var(--green)':'var(--text2)'};font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer">✓ Went to Gym</button>
        <button onclick="toggleAttendance('${todayKey()}', false)" style="flex:1;padding:13px;border-radius:10px;border:1px solid ${state.attendance[todayKey()]===false?'var(--red)':'var(--border)'};background:${state.attendance[todayKey()]===false?'rgba(255,23,68,.1)':'var(--bg1)'};color:${state.attendance[todayKey()]===false?'var(--red)':'var(--text2)'};font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer">✕ Skipped</button>
      </div>
    </div>`;
}

function toggleAttendance(k, forcedVal) {
  if (forcedVal !== undefined) {
    if (state.attendance[k] === forcedVal) delete state.attendance[k];
    else state.attendance[k] = forcedVal;
  } else {
    // Toggle: null → present → absent → null
    const cur = state.attendance[k];
    if (cur === undefined) state.attendance[k] = true;
    else if (cur === true) state.attendance[k] = false;
    else delete state.attendance[k];
  }
  save('forge_attendance', state.attendance);
  renderAttendance();
}

function shiftMonth(dir) {
  calViewDate.setMonth(calViewDate.getMonth() + dir);
  renderAttendance();
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function drawWeightChart(data) {
  const canvas = document.getElementById('weightChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { t: 10, r: 10, b: 30, l: 40 };
  const vals = data.map(d => d.value);
  const minV = Math.min(...vals) - 1, maxV = Math.max(...vals) + 1;
  const gx = i => pad.l + (i / (data.length-1)) * (W - pad.l - pad.r);
  const gy = v => pad.t + (1 - (v-minV)/(maxV-minV)) * (H - pad.t - pad.b);

  // Grid lines
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
  for (let i=0; i<=4; i++) {
    const y = pad.t + i * (H-pad.t-pad.b)/4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    const v = maxV - i*(maxV-minV)/4;
    ctx.fillStyle = '#555'; ctx.font = '10px Barlow Condensed'; ctx.textAlign='right';
    ctx.fillText(v.toFixed(1), pad.l-4, y+4);
  }

  // Area fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, H-pad.b);
  grad.addColorStop(0, 'rgba(255,61,0,.25)');
  grad.addColorStop(1, 'rgba(255,61,0,0)');
  ctx.beginPath();
  ctx.moveTo(gx(0), gy(data[0].value));
  data.forEach((d,i) => { if (i>0) ctx.lineTo(gx(i), gy(d.value)); });
  ctx.lineTo(gx(data.length-1), H-pad.b);
  ctx.lineTo(gx(0), H-pad.b);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath(); ctx.strokeStyle='#FF3D00'; ctx.lineWidth=2;
  data.forEach((d,i) => i===0 ? ctx.moveTo(gx(0),gy(d.value)) : ctx.lineTo(gx(i),gy(d.value)));
  ctx.stroke();

  // Dots
  data.forEach((d,i) => {
    ctx.beginPath(); ctx.arc(gx(i), gy(d.value), 3, 0, Math.PI*2);
    ctx.fillStyle='#FF3D00'; ctx.fill();
  });

  // X-axis labels (first, middle, last)
  ctx.fillStyle = '#555'; ctx.font = '10px Barlow Condensed'; ctx.textAlign='center';
  [0, Math.floor(data.length/2), data.length-1].forEach(i => {
    if (data[i]) {
      const parts = data[i].date.split('-');
      ctx.fillText(`${parts[2]}/${parts[1]}`, gx(i), H-pad.b+16);
    }
  });
}

// SERVICE WORKER + IndexedDB IMAGE BRIDGE
// ══════════════════════════════════════════════

// ── SW Registration ───────────────────────────
let _swReady = null;

if ('serviceWorker' in navigator) {
  _swReady = navigator.serviceWorker.register('./sw.js')
    .then(reg => {
      console.log('[FORGE] Service Worker registered:', reg.scope);
    })
    .catch(err => {
      console.warn('[FORGE] SW registration failed (running offline from file:// not supported):', err);
    });
}

// ── IndexedDB bridge via SW postMessage ───────
// Sends a message to the active SW and returns the reply via MessageChannel.
function swMessage(payload) {
  return new Promise((resolve, reject) => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) {
      // SW not yet controlling (first load) — fall back gracefully
      resolve(null);
      return;
    }
    const ch = new MessageChannel();
    ch.port1.onmessage = e => {
      if (e.data && e.data.ok) resolve(e.data);
      else reject(new Error((e.data && e.data.error) || 'SW error'));
    };
    sw.postMessage(payload, [ch.port2]);
  });
}

// Public helpers used by image upload / load code
async function idbSaveImage(exId, dataURL) {
  try {
    await swMessage({ type: 'SAVE_IMAGE', id: exId, dataURL });
  } catch (e) { /* SW not ready yet — localStorage already has it */ }
}

async function idbGetAllImages() {
  try {
    const res = await swMessage({ type: 'GET_ALL_IMAGES' });
    return (res && res.images) ? res.images : null;
  } catch { return null; }
}

async function idbDeleteImage(exId) {
  try {
    await swMessage({ type: 'DELETE_IMAGE', id: exId });
  } catch {}
}

// ── On SW activation, pull all IndexedDB images into state ──
// This ensures images are available even if localStorage was cleared.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.ready.then(async () => {
    // Small delay so controller is set
    await new Promise(r => setTimeout(r, 200));
    const idbImages = await idbGetAllImages();
    if (idbImages) {
      let merged = false;
      Object.entries(idbImages).forEach(([id, dataURL]) => {
        if (!state.exerciseImages[id] && dataURL) {
          state.exerciseImages[id] = dataURL;
          merged = true;
        }
      });
      if (merged) {
        save('forge_exImages', state.exerciseImages);
        // Re-render current view to show restored images
        if (state.currentPage === 'home') renderHome();
        else if (state.currentPage === 'day') {
          const plan = getDayPlan(state.currentDayId);
          renderDayExercises(plan);
        }
      }
    }
  });
}

  let exRows = editDayExercises.length
    ? editDayExercises.map((ex, idx) => `
        <div class="edit-ex-row">
          <div style="width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div class="edit-ex-name">${ex.name}</div>
            <div class="edit-ex-muscle">${ex.primary}</div>
          </div>
          <div style="display:flex;gap:6px">
            ${idx > 0 ? `<div onclick="moveEditEx(${idx},-1)" style="width:28px;height:28px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:14px" title="Move up">↑</div>` : '<div style="width:28px"></div>'}
            ${idx < editDayExercises.length - 1 ? `<div onclick="moveEditEx(${idx},1)" style="width:28px;height:28px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:14px" title="Move down">↓</div>` : '<div style="width:28px"></div>'}
            <div class="edit-ex-remove" onclick="removeEditEx(${idx})">✕</div>
          </div>
        </div>`).join('')
    : `<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">No exercises. Add some below.</div>`;

  // Title editor
  let titleHtml = `
    <div class="edit-section-label">Workout Name</div>
    <input class="title-edit-input" id="edit-title-input" value="${editDayTitle}" placeholder="e.g. Push Day" maxlength="40">
  `;

  // Add exercise picker
  let pickerHtml = '';
  if (showAddPicker) {
    const currentIds = new Set(editDayExercises.map(e => e.id));
    const options = ALL_EXERCISES.map(ex => {
      const already = currentIds.has(ex.id);
      return `<div class="add-ex-option ${already ? 'already-added' : ''}" onclick="${already ? '' : `addEditEx('${ex.id}')`}">
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font-display);font-size:14px;font-weight:700">${ex.name}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${ex.primary}</div>
        </div>
        ${already ? `<span style="font-size:11px;color:var(--text3);font-family:var(--font-display)">Added</span>` : `<span style="font-size:18px;color:var(--accent)">+</span>`}
      </div>`;
    }).join('');

    pickerHtml = `
      <div class="add-ex-picker">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="edit-section-label" style="margin:0">Add Exercise</div>
          <div onclick="showAddPicker=false;renderEditModal()" style="font-size:12px;color:var(--text3);cursor:pointer;font-family:var(--font-body)">✕ Close</div>
        </div>
        ${options}
      </div>`;
  }

  scroll.innerHTML = `
    ${titleHtml}
    <div class="edit-section-label" style="margin-top:12px">Exercises (${editDayExercises.length})</div>
    ${exRows}
    ${!showAddPicker ? `<button onclick="showAddPicker=true;renderEditModal()" style="width:100%;padding:11px;margin-top:8px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--text2);font-family:var(--font-display);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px">+ Add Exercise</button>` : ''}
    ${pickerHtml}
  `;
}

function moveEditEx(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= editDayExercises.length) return;
  const tmp = editDayExercises[idx];
  editDayExercises[idx] = editDayExercises[newIdx];
  editDayExercises[newIdx] = tmp;
  renderEditModal();
}

function removeEditEx(idx) {
  editDayExercises.splice(idx, 1);
  renderEditModal();
}

function addEditEx(exId) {
  const ex = ALL_EXERCISES.find(e => e.id === exId);
  if (ex && !editDayExercises.find(e => e.id === exId)) {
    editDayExercises.push(JSON.parse(JSON.stringify(ex)));
  }
  showAddPicker = false;
  renderEditModal();
}

function saveEditDay() {
  const titleInput = document.getElementById('edit-title-input');
  const newTitle = (titleInput ? titleInput.value.trim() : '') || editDayTitle;
  // Apply to WORKOUT_PLAN
  const plan = getDayPlan(editDayNum);
  plan.exercises = JSON.parse(JSON.stringify(editDayExercises));
  plan.title = newTitle;
  saveWorkoutPlan();
  closeEditDay();
  renderWorkouts();
  renderHome();
  showToast(`Day ${editDayNum} updated ✓`);
}

function resetDayToDefault() {
  const def = DEFAULT_PLAN[editDayNum - 1];
  editDayExercises = JSON.parse(JSON.stringify(def.exercises));
  editDayTitle = def.title;
  showAddPicker = false;
  renderEditModal();
  showToast('Reset to default');
}

// ══════════════════════════════════════════════
// WEIGHT EDIT / DELETE / ADD PAST
// ══════════════════════════════════════════════

let _editingWeightDate = null; // date key of currently inline-editing row

function startEditWeight(dateKey) {
  // Cancel any other open edit
  if (_editingWeightDate && _editingWeightDate !== dateKey) cancelEditWeight(_editingWeightDate);
  _editingWeightDate = dateKey;
  const entry = state.weights.find(w => w.date === dateKey);
  if (!entry) return;
  const area = document.getElementById(`we-edit-area-${dateKey}`);
  if (!area) return;
  area.innerHTML = `
    <div class="we-edit-row">
      <input type="number" class="we-edit-input" id="we-input-${dateKey}"
        value="${entry.value}" step="0.1" min="20" max="300">
      <span style="font-size:13px;color:var(--text2)">kg</span>
      <button class="we-save-btn" onclick="confirmEditWeight('${dateKey}')">Save</button>
      <button class="we-cancel-btn" onclick="cancelEditWeight('${dateKey}')">✕</button>
    </div>`;
  setTimeout(() => {
    const inp = document.getElementById(`we-input-${dateKey}`);
    if (inp) inp.focus();
  }, 50);
}

function cancelEditWeight(dateKey) {
  const area = document.getElementById(`we-edit-area-${dateKey}`);
  if (area) area.innerHTML = '';
  _editingWeightDate = null;
}

function confirmEditWeight(dateKey) {
  const inp = document.getElementById(`we-input-${dateKey}`);
  if (!inp) return;
  const val = parseFloat(inp.value);
  if (!val || val < 20 || val > 300) { showToast('Enter a valid weight (20–300 kg)'); return; }
  const idx = state.weights.findIndex(w => w.date === dateKey);
  if (idx < 0) return;
  state.weights[idx].value = val;
  save('forge_weights', state.weights);
  _editingWeightDate = null;
  renderWeight();
  showToast('Weight updated ✓');
}

function deleteWeight(dateKey) {
  const d = new Date(dateKey + 'T00:00:00');
  const label = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  if (!confirm(`Delete weight entry for ${label}?`)) return;
  state.weights = state.weights.filter(w => w.date !== dateKey);
  save('forge_weights', state.weights);
  renderWeight();
  showToast('Entry deleted');
}

// ── Add weight for a past date ─────────────────
let _weightEditMode = 'add'; // 'add' only (edit is inline)

function openAddPastWeight() {
  _weightEditMode = 'add';
  const modal = document.getElementById('weight-edit-modal');
  document.getElementById('weight-edit-modal-title').textContent = 'Add Past Weight';
  const today = todayKey();
  document.getElementById('weight-edit-modal-body').innerHTML = `
    <div style="margin-bottom:8px;font-size:13px;color:var(--text2)">Date</div>
    <div class="date-input-row">
      <input type="date" class="date-input-field" id="past-weight-date"
        max="${today}" value="${today}">
    </div>
    <div style="margin-bottom:8px;font-size:13px;color:var(--text2)">Weight</div>
    <div class="weight-input-row" style="margin-bottom:0">
      <input type="number" class="weight-input" id="past-weight-val"
        placeholder="75.0" step="0.1" min="20" max="300">
      <span class="weight-unit">kg</span>
    </div>`;
  modal.classList.add('open');
  setTimeout(() => {
    const inp = document.getElementById('past-weight-val');
    if (inp) inp.focus();
  }, 350);
}

function closeWeightEditModal(e) {
  if (!e || e.target === document.getElementById('weight-edit-modal')) {
    document.getElementById('weight-edit-modal').classList.remove('open');
  }
}

function saveWeightEditModal() {
  const dateEl = document.getElementById('past-weight-date');
  const valEl  = document.getElementById('past-weight-val');
  if (!dateEl || !valEl) return;
  const dateStr = dateEl.value;
  const val     = parseFloat(valEl.value);
  if (!dateStr) { showToast('Pick a date'); return; }
  if (!val || val < 20 || val > 300) { showToast('Enter a valid weight (20–300 kg)'); return; }
  const idx = state.weights.findIndex(w => w.date === dateStr);
  if (idx >= 0) state.weights[idx].value = val;
  else state.weights.push({ date: dateStr, value: val });
  save('forge_weights', state.weights);
  closeWeightEditModal();
  renderWeight();
  showToast('Weight saved ✓');
}

// ══════════════════════════════════════════════
// WORKOUT LOG FILL MODAL
// ══════════════════════════════════════════════

let _wlOpenSections = {}; // dateKey → bool

function openWorkoutLogModal() {
  _wlOpenSections = {};
  renderWorkoutLogModal();
  document.getElementById('workout-log-modal').classList.add('open');
}

function closeWorkoutLogModal(e) {
  if (!e || e.target === document.getElementById('workout-log-modal')) {
    document.getElementById('workout-log-modal').classList.remove('open');
    renderHome();
    renderWorkouts();
  }
}

function renderWorkoutLogModal() {
  const body = document.getElementById('workout-log-modal-body');

  // Build last 30 days (excluding today — today has its own inline controls)
  const rows = [];
  const today = new Date();
  for (let i = 1; i <= 30; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const k = dateKey(d);
    // day-of-week 1–7
    const js = d.getDay();
    const dow = js === 0 ? 7 : js;
    const plan = getDayPlan(dow);
    rows.push({ date: d, key: k, plan, dow });
  }

  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let html = `
    <div style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px;font-family:var(--font-display);letter-spacing:.5px;text-transform:uppercase">Today's workout</div>
      ${buildTodayLogRow()}
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px;font-family:var(--font-display);letter-spacing:.5px;text-transform:uppercase">Past 30 days</div>`;

  rows.forEach(({ date, key, plan }) => {
    const log = state.workoutLog[key] || {};
    const doneCount  = plan.exercises.filter(e => log[e.id] === 'completed').length;
    const missCount  = plan.exercises.filter(e => log[e.id] === 'missed').length;
    const totalEx    = plan.exercises.length;
    const isOpen     = !!_wlOpenSections[key];
    const hasData    = doneCount > 0 || missCount > 0;
    const summaryTxt = totalEx === 0 ? 'Rest day'
      : hasData ? `${doneCount}/${totalEx} done${missCount ? ', ' + missCount + ' missed' : ''}`
      : 'No data';

    html += `
      <div class="wl-date-section">
        <div class="wl-date-header" onclick="toggleWLSection('${key}')">
          <div>
            <div class="wl-date-label">${dayNames[date.getDay()]}, ${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()}</div>
            <div class="wl-date-sub">${plan.title} · ${summaryTxt}</div>
          </div>
          <div class="wl-chevron ${isOpen ? 'open' : ''}">›</div>
        </div>
        ${totalEx > 0 ? `
        <div class="wl-exercises ${isOpen ? 'open' : ''}" id="wl-ex-${key}">
          <div class="wl-quick-fill">
            <span class="wl-qf-label">Quick fill</span>
            <button class="wl-qf-btn" onclick="wlFillAll('${key}','completed');event.stopPropagation()">✓ All Done</button>
            <button class="wl-qf-btn" onclick="wlFillAll('${key}','missed');event.stopPropagation()">✕ All Missed</button>
            <button class="wl-qf-btn" onclick="wlFillAll('${key}',null);event.stopPropagation()">Clear</button>
          </div>
          ${plan.exercises.map(ex => {
            const st = log[ex.id] || null;
            return `<div class="wl-ex-row">
              <div class="wl-ex-name">${ex.name}</div>
              <div class="wl-ex-btns">
                <button class="wl-ex-btn ${st==='completed'?'done-on':''}" onclick="wlSetEx('${key}','${ex.id}','completed');event.stopPropagation()">✓ Done</button>
                <button class="wl-ex-btn ${st==='missed'?'miss-on':''}" onclick="wlSetEx('${key}','${ex.id}','missed');event.stopPropagation()">✕ Miss</button>
              </div>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>`;
  });

  body.innerHTML = html;
}

function buildTodayLogRow() {
  const k    = todayKey();
  const dow  = getCurrentDayOfWeek();
  const plan = getDayPlan(dow);
  const log  = state.workoutLog[k] || {};
  if (!plan.exercises.length) return `<div style="color:var(--text3);font-size:13px">Rest day today.</div>`;
  return `
    <div class="wl-date-section">
      <div class="wl-quick-fill">
        <span class="wl-qf-label">Quick fill</span>
        <button class="wl-qf-btn" onclick="wlFillAll('${k}','completed')">✓ All Done</button>
        <button class="wl-qf-btn" onclick="wlFillAll('${k}','missed')">✕ All Missed</button>
        <button class="wl-qf-btn" onclick="wlFillAll('${k}',null)">Clear</button>
      </div>
      <div class="wl-exercises open" style="display:block">
        ${plan.exercises.map(ex => {
          const st = log[ex.id] || null;
          return `<div class="wl-ex-row">
            <div class="wl-ex-name">${ex.name}</div>
            <div class="wl-ex-btns">
              <button class="wl-ex-btn ${st==='completed'?'done-on':''}" onclick="wlSetEx('${k}','${ex.id}','completed')">✓ Done</button>
              <button class="wl-ex-btn ${st==='missed'?'miss-on':''}" onclick="wlSetEx('${k}','${ex.id}','missed')">✕ Miss</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function toggleWLSection(key) {
  _wlOpenSections[key] = !_wlOpenSections[key];
  renderWorkoutLogModal();
}

function wlSetEx(dateKey, exId, status) {
  if (!state.workoutLog[dateKey]) state.workoutLog[dateKey] = {};
  // Toggle off if already set
  if (state.workoutLog[dateKey][exId] === status) {
    delete state.workoutLog[dateKey][exId];
  } else {
    state.workoutLog[dateKey][exId] = status;
  }
  save('forge_workoutLog', state.workoutLog);
  renderWorkoutLogModal();
}

function wlFillAll(dateKey, status) {
  const d   = new Date(dateKey + 'T00:00:00');
  const js  = d.getDay();
  const dow = js === 0 ? 7 : js;
  const plan = getDayPlan(dow);
  if (!state.workoutLog[dateKey]) state.workoutLog[dateKey] = {};
  plan.exercises.forEach(ex => {
    if (status === null) delete state.workoutLog[dateKey][ex.id];
    else state.workoutLog[dateKey][ex.id] = status;
  });
  save('forge_workoutLog', state.workoutLog);
  renderWorkoutLogModal();
  showToast(status === 'completed' ? 'Marked all done ✓' : status === 'missed' ? 'Marked all missed' : 'Cleared');
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
renderHome();
renderWorkouts();
</script>
</body>
</html>
