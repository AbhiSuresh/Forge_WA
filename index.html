<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<!-- Add your base64 icons and original head scripts here -->
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.svg">
<title>FORGE</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #000000;
        --card-bg: #121212;
        --accent: #E53935;
        --text-main: #FFFFFF;
        --text-muted: #9E9E9E;
    }
    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Barlow', sans-serif;
        padding-bottom: 80px;
    }
    header {
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid #333;
        position: sticky;
        top: 0;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        z-index: 100;
    }
    h1 {
        font-family: 'Barlow Condensed', sans-serif;
        margin: 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
    }
    .container {
        padding: 15px;
    }
    .day-card {
        background-color: var(--card-bg);
        border-radius: 12px;
        margin-bottom: 15px;
        overflow: hidden;
        border: 1px solid #222;
    }
    .day-header {
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        background-color: #1a1a1a;
    }
    .day-title {
        font-weight: 600;
        font-size: 1.2rem;
        margin: 0;
    }
    .exercise-list {
        display: none;
        padding: 0;
        margin: 0;
        list-style: none;
    }
    .day-card.active .exercise-list {
        display: block;
    }
    .exercise-item {
        padding: 15px;
        border-top: 1px solid #222;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .exercise-info {
        display: flex;
        flex-direction: column;
    }
    .exercise-name {
        font-weight: 500;
        font-size: 1.1rem;
    }
    .exercise-sets {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-top: 4px;
    }
    .checkbox-wrapper {
        width: 24px;
        height: 24px;
        border: 2px solid var(--accent);
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    input[type="checkbox"] {
        display: none;
    }
    input[type="checkbox"]:checked + .checkbox-wrapper {
        background-color: var(--accent);
    }
    input[type="checkbox"]:checked + .checkbox-wrapper::after {
        content: '✓';
        color: white;
        font-size: 16px;
    }
</style>
</head>
<body>

<header>
    <h1>FORGE</h1>
</header>

<div class="container" id="workout-container">
    <!-- Workout days will be injected here via JavaScript -->
</div>

<script>
    // Manifest data structure preserved
    const manifestData = {
        name: "FORGE Workout Tracker",
        short_name: "FORGE",
        description: "AMOLED workout tracker with gym attendance and weight logging",
        start_url: "./",
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        orientation: "portrait"
    };

    const workoutPlan = [
        {
            day: "Day 1 - Push A",
            exercises: [
                { name: "Chest Press Machine", sets: "3 × 8-12" },
                { name: "Incline Dumbbell Press", sets: "3 × 8-12" },
                { name: "Shoulder Press Machine", sets: "3 × 10-12" },
                { name: "Cable Lateral Raise", sets: "3 × 12-15" },
                { name: "Triceps Rope Pushdown", sets: "3 × 10-15" },
                { name: "Plank", sets: "3 × 30-45 s" }
            ]
        },
        {
            day: "Day 2 - Pull A",
            exercises: [
                { name: "Lat Pulldown", sets: "3 × 8-12" },
                { name: "Seated Cable Row", sets: "3 × 8-12" },
                { name: "Chest-Supported / Machine Row", sets: "3 × 10-12" },
                { name: "Face Pull", sets: "3 × 12-15" },
                { name: "Dumbbell Curl", sets: "3 × 10-12" },
                { name: "Incline Walk", sets: "20 min" }
            ]
        },
        {
            day: "Day 3 - Legs A",
            exercises: [
                { name: "Leg Press", sets: "4 × 10-12" },
                { name: "Romanian Deadlift (Dumbbells)", sets: "3 × 8-10" },
                { name: "Bodyweight Squat", sets: "3 × 15-20 (3s down, 1s pause)" },
                { name: "Leg Curl Machine", sets: "3 × 12" },
                { name: "Calf Raise", sets: "3 × 15" },
                { name: "Cable Crunch", sets: "3 × 12-15" }
            ]
        },
        {
            day: "Day 4 - Push B",
            exercises: [
                { name: "Incline Chest Press Machine", sets: "3 × 8-12" },
                { name: "Flat Dumbbell Press", sets: "3 × 8-12" },
                { name: "Pec Deck", sets: "3 × 12-15" },
                { name: "Seated Dumbbell Shoulder Press", sets: "3 × 10" },
                { name: "Overhead Cable Triceps Extension", sets: "3 × 12" },
                { name: "Cycle", sets: "20 min" }
            ]
        },
        {
            day: "Day 5 - Pull B",
            exercises: [
                { name: "Lat Pulldown (Wide Grip)", sets: "3 × 8-12" },
                { name: "Single-Arm Dumbbell Row", sets: "3 × 10 each side" },
                { name: "Chest-Supported / Machine Row", sets: "3 × 10-12" },
                { name: "Rear Delt Pec Deck", sets: "3 × 12-15" },
                { name: "Hammer Curl", sets: "3 × 10-12" },
                { name: "Dead Bug", sets: "3 × 12" }
            ]
        },
        {
            day: "Day 6 - Legs B + Cardio",
            exercises: [
                { name: "Hip Thrust", sets: "4 × 10-12" },
                { name: "Leg Press (Feet high and wide, lighter)", sets: "3 × 12-15" },
                { name: "Bodyweight Squat", sets: "3 × 15-20 (3s down, 1s pause)" },
                { name: "Leg Extension", sets: "3 × 12-15" },
                { name: "Seated Leg Curl", sets: "3 × 12" },
                { name: "Seated Calf Raise", sets: "3 × 15" },
                { name: "Cross-Trainer", sets: "25-30 min" }
            ]
        },
        {
            day: "Day 7 - Rest",
            exercises: [
                { name: "Easy Walk", sets: "Active Recovery" },
                { name: "Hit Protein Target", sets: "Nutrition" },
                { name: "Good Sleep", sets: "Recovery" }
            ]
        }
    ];

    const container = document.getElementById('workout-container');

    workoutPlan.forEach((routine, dayIndex) => {
        const card = document.createElement('div');
        card.className = 'day-card';
        
        const header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `<h2 class="day-title">${routine.day}</h2><span class="toggle-icon">▼</span>`;
        
        const list = document.createElement('ul');
        list.className = 'exercise-list';
        
        routine.exercises.forEach((ex, exIndex) => {
            const li = document.createElement('li');
            li.className = 'exercise-item';
            const checkboxId = `d${dayIndex}-e${exIndex}`;
            
            li.innerHTML = `
                <div class="exercise-info">
                    <span class="exercise-name">${ex.name}</span>
                    <span class="exercise-sets">${ex.sets}</span>
                </div>
                <label>
                    <input type="checkbox" id="${checkboxId}">
                    <div class="checkbox-wrapper"></div>
                </label>
            `;
            list.appendChild(li);
        });

        header.addEventListener('click', () => {
            const isActive = card.classList.contains('active');
            document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
            if (!isActive) card.classList.add('active');
        });

        card.appendChild(header);
        card.appendChild(list);
        container.appendChild(card);
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => {
                console.log('Service Worker registration failed: ', err);
            });
        });
    }
</script>
</body>
</html>
